# ClinicFlow's login theme: Keycloak's keycloak.v2 pages in the app's look. Only template.ftl, the
# messages and css/clinicflow.css are ClinicFlow's; every page template comes from the parent.
parent=keycloak.v2
import=common/keycloak

# css/styles.css is the parent's; ClinicFlow's stylesheet comes last so its rules win.
styles=css/styles.css css/clinicflow.css

# The app opens in its light theme whatever the system setting, so the sign-in pages do too.
darkMode=false
