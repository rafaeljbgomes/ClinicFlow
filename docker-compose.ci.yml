services:
  gateway:
    image: clinicflow/gateway:ci-${CLINICFLOW_CI_IMAGE_TAG:-local}
    environment:
      CLINICFLOW_GATEWAY_TLS: "false"
      CLINICFLOW_GATEWAY_PUBLIC_AVERAGE: "1000"
      CLINICFLOW_GATEWAY_PUBLIC_BURST: "2000"
      CLINICFLOW_GATEWAY_AUTH_AVERAGE: "1000"
      CLINICFLOW_GATEWAY_AUTH_PERIOD: "1s"
      CLINICFLOW_GATEWAY_AUTH_BURST: "2000"
    ports: !override
      - "${CLINICFLOW_GATEWAY_HTTP_PORT:-3000}:8000"
    volumes: !override []
  postgres:
    image: clinicflow/postgres:ci-${CLINICFLOW_CI_IMAGE_TAG:-local}
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/helm/platform/files/bootstrap:/platform-bootstrap:ro

  # The SQL comes from the built image; credentials are generated on the runner (ADR-026).
  postgres-bootstrap:
    image: clinicflow/postgres-bootstrap:ci-${CLINICFLOW_CI_IMAGE_TAG:-local}
    volumes: !override
      - ./deploy/helm/platform/files/bootstrap:/platform-bootstrap:ro
      - ./secrets/services:/credentials:ro

  # The realm comes from the built image. Its redirect URIs follow the run's isolated gateway port.
  keycloak:
    image: clinicflow/keycloak:ci-${CLINICFLOW_CI_IMAGE_TAG:-local}
    environment:
      CLINICFLOW_PUBLIC_URL: http://localhost:${CLINICFLOW_GATEWAY_HTTP_PORT:-3000}

  jwt-secrets-bootstrap:
    image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        if [ ! -s /secrets/jwt-private.pem ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /secrets/jwt-private.pem
        fi
        openssl pkey -in /secrets/jwt-private.pem -pubout -out /secrets/jwt-public.pem
        # auth-service runs as UID 10001 and is the only reader of the private key.
        chown 10001:10001 /secrets/jwt-private.pem
        chmod 600 /secrets/jwt-private.pem
        chmod 644 /secrets/jwt-public.pem
    volumes:
      - jwt-secrets:/secrets
    restart: "no"

  auth-service:
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro
    depends_on:
      jwt-secrets-bootstrap:
        condition: service_completed_successfully

  frontend:
    environment:
      CLINICFLOW_AUTH_COOKIE_SECURE: "false"
      CLINICFLOW_PUBLIC_URL: http://localhost:${CLINICFLOW_GATEWAY_HTTP_PORT:-3000}

volumes:
  jwt-secrets:
