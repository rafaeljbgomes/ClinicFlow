services:
  gateway:
    environment:
      CLINICFLOW_GATEWAY_TLS: "false"
      CLINICFLOW_GATEWAY_PUBLIC_AVERAGE: "1000"
      CLINICFLOW_GATEWAY_PUBLIC_BURST: "2000"
      CLINICFLOW_GATEWAY_AUTH_AVERAGE: "1000"
      CLINICFLOW_GATEWAY_AUTH_PERIOD: "1s"
      CLINICFLOW_GATEWAY_AUTH_BURST: "2000"
    ports: !override
      - "${CLINICFLOW_GATEWAY_HTTP_PORT:-3000}:8000"
    volumes: !override []
  postgres:
    volumes: !override
      - postgres-data:/var/lib/postgresql/data

  postgres-bootstrap:
    build:
      context: ./docker/postgres/bootstrap
      dockerfile: Dockerfile
    image: clinicflow/postgres-bootstrap:ci
    volumes: !override []

  jwt-secrets-bootstrap:
    image: alpine/openssl:3.5.7@sha256:47f40fac08a77cbdfb02444e543808aa36b9e31e21a261f4d94ffaf0c5c73832
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        if [ ! -s /secrets/jwt-private.pem ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /secrets/jwt-private.pem
        fi
        openssl pkey -in /secrets/jwt-private.pem -pubout -out /secrets/jwt-public.pem
        chmod 600 /secrets/jwt-private.pem
        chmod 644 /secrets/jwt-public.pem
    volumes:
      - jwt-secrets:/secrets
    restart: "no"

  auth-service:
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro
    depends_on:
      jwt-secrets-bootstrap:
        condition: service_completed_successfully

  patient-service:
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro
    depends_on:
      jwt-secrets-bootstrap:
        condition: service_completed_successfully

  appointment-service:
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro
    depends_on:
      jwt-secrets-bootstrap:
        condition: service_completed_successfully

  clinical-service:
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro
    depends_on:
      jwt-secrets-bootstrap:
        condition: service_completed_successfully

  notification-service:
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro
    depends_on:
      jwt-secrets-bootstrap:
        condition: service_completed_successfully

  frontend:
    environment:
      CLINICFLOW_AUTH_COOKIE_SECURE: "false"
    volumes: !override
      - jwt-secrets:/run/secrets/clinicflow:ro

volumes:
  jwt-secrets:
