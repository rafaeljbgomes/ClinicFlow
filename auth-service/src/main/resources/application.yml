server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow_auth}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:clinicflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    com.clinicflow: INFO

clinicflow:
  security:
    jwt:
      issuer: ${CLINICFLOW_SECURITY_JWT_ISSUER:clinicflow-auth}
      ttl-minutes: ${CLINICFLOW_SECURITY_JWT_TTL_MINUTES:30}
      private-key: ${CLINICFLOW_SECURITY_JWT_PRIVATE_KEY:}
      private-key-path: ${CLINICFLOW_SECURITY_JWT_PRIVATE_KEY_PATH:}
      public-key: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY:}
      public-key-path: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH:}
