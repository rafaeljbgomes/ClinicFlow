server:
  port: 8082

spring:
  application:
    name: patient-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow_patient}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:clinicflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:clinicflow}
    password: ${SPRING_RABBITMQ_PASSWORD:clinicflow}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
  level:
    com.clinicflow: INFO

clinicflow:
  security:
    jwt:
      issuer: ${CLINICFLOW_SECURITY_JWT_ISSUER:clinicflow-auth}
      public-key: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY:}
      public-key-path: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH:}
  messaging:
    exchange: therapy.events.exchange
