server:
  port: 8082

spring:
  application:
    name: patient-service
  # Keycloak tokens (ADR-027): keys come from the private-network JWKS, iss must be the public issuer.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLINICFLOW_OIDC_ISSUER:http://localhost:8180/realms/clinicflow}
          jwk-set-uri: ${CLINICFLOW_OIDC_JWKS_URI:http://localhost:8180/realms/clinicflow/protocol/openid-connect/certs}
          audiences: [clinicflow-api]
          authorities-claim-name: roles
          authority-prefix: ROLE_
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow_patient}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:clinicflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:clinicflow}
    password: ${SPRING_RABBITMQ_PASSWORD:clinicflow}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
  level:
    com.clinicflow: INFO

clinicflow:
  messaging:
    exchange: therapy.events.exchange
  outbox:
    enabled: ${CLINICFLOW_OUTBOX_ENABLED:true}
    poll-interval: ${CLINICFLOW_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${CLINICFLOW_OUTBOX_BATCH_SIZE:20}
    confirm-timeout: ${CLINICFLOW_OUTBOX_CONFIRM_TIMEOUT:5s}
    retry-initial: ${CLINICFLOW_OUTBOX_RETRY_INITIAL:1s}
    retry-max: ${CLINICFLOW_OUTBOX_RETRY_MAX:1m}
    cleanup-interval: ${CLINICFLOW_OUTBOX_CLEANUP_INTERVAL:1h}
    published-retention: ${CLINICFLOW_OUTBOX_PUBLISHED_RETENTION:7d}
