services:
  gateway:
    build:
      context: ./deploy/gateway
    image: clinicflow/gateway:local
    environment:
      CLINICFLOW_GATEWAY_TLS: "true"
      CLINICFLOW_GATEWAY_HTTPS_PORT: "${CLINICFLOW_GATEWAY_HTTPS_PORT:-443}"
    ports:
      - "${CLINICFLOW_GATEWAY_HTTP_PORT:-80}:8000"
      - "${CLINICFLOW_GATEWAY_HTTPS_PORT:-443}:8443"
    volumes:
      - ./secrets/edge/edge.crt:/certs/edge.crt:ro
      - ./secrets/edge/edge.key:/certs/edge.key:ro
    group_add: ["${CLINICFLOW_TLS_GROUP:-65532}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
        reservations: {cpus: '0.1', memory: 128M}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
      POSTGRES_DB: clinicflow
    ports:
      - "${CLINICFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-bootstrap:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      PGPASSWORD: clinicflow
    volumes:
      - ./docker/postgres/bootstrap:/bootstrap:ro
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U clinicflow -d clinicflow -f /bootstrap/01-ensure-databases.sql
      && psql -v ON_ERROR_STOP=1 -h postgres -U clinicflow -d clinicflow_patient -f /bootstrap/02-sanitize-patient-phone-data.sql"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
    environment:
      RABBITMQ_DEFAULT_USER: clinicflow
      RABBITMQ_DEFAULT_PASS: clinicflow
    ports:
      - "${CLINICFLOW_RABBITMQ_PORT:-5672}:5672"
      - "${CLINICFLOW_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_auth
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_SECURITY_JWT_PRIVATE_KEY_PATH: /run/secrets/clinicflow/jwt-private.pem
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_patient
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_appointment
      CLINICFLOW_SERVICES_PATIENT_BASE_URL: http://patient-service:8082
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  clinical-service:
    build:
      context: .
      dockerfile: clinical-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_clinical
      CLINICFLOW_SERVICES_PATIENT_BASE_URL: http://patient-service:8082
      CLINICFLOW_SERVICES_APPOINTMENT_BASE_URL: http://appointment-service:8083
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_notification
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8080
      AUTH_SERVICE_HEALTH_URL: http://auth-service:9000
      PATIENT_SERVICE_HEALTH_URL: http://patient-service:9000
      APPOINTMENT_SERVICE_HEALTH_URL: http://appointment-service:9000
      CLINICAL_SERVICE_HEALTH_URL: http://clinical-service:9000
      NOTIFICATION_SERVICE_HEALTH_URL: http://notification-service:9000
      CLINICFLOW_AUTH_COOKIE_SECURE: "true"
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    depends_on:
      - auth-service
      - patient-service
      - appointment-service
      - clinical-service
      - notification-service

volumes:
  postgres-data:
  rabbitmq-data:
