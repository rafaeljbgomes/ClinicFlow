services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicflow
      POSTGRES_PASSWORD: clinicflow
      POSTGRES_DB: clinicflow
    ports:
      - "${CLINICFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-bootstrap:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: clinicflow
    volumes:
      - ./docker/postgres/bootstrap:/bootstrap:ro
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U clinicflow -d clinicflow -f /bootstrap/01-ensure-databases.sql
      && psql -v ON_ERROR_STOP=1 -h postgres -U clinicflow -d clinicflow_patient -f /bootstrap/02-sanitize-patient-phone-data.sql"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: clinicflow
      RABBITMQ_DEFAULT_PASS: clinicflow
    ports:
      - "${CLINICFLOW_RABBITMQ_PORT:-5672}:5672"
      - "${CLINICFLOW_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_auth
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_SECURITY_JWT_PRIVATE_KEY_PATH: /run/secrets/clinicflow/jwt-private.pem
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    ports:
      - "${CLINICFLOW_AUTH_PORT:-8081}:8081"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_patient
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    ports:
      - "${CLINICFLOW_PATIENT_PORT:-8082}:8082"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_appointment
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    ports:
      - "${CLINICFLOW_APPOINTMENT_PORT:-8083}:8083"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  clinical-service:
    build:
      context: .
      dockerfile: clinical-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_clinical
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    ports:
      - "${CLINICFLOW_CLINICAL_PORT:-8085}:8085"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_notification
      SPRING_DATASOURCE_USERNAME: clinicflow
      SPRING_DATASOURCE_PASSWORD: clinicflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: clinicflow
      SPRING_RABBITMQ_PASSWORD: clinicflow
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
    volumes:
      - ./secrets:/run/secrets/clinicflow:ro
    ports:
      - "${CLINICFLOW_NOTIFICATION_PORT:-8084}:8084"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PATIENT_SERVICE_URL: http://patient-service:8082
      APPOINTMENT_SERVICE_URL: http://appointment-service:8083
      CLINICAL_SERVICE_URL: http://clinical-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports:
      - "${CLINICFLOW_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - auth-service
      - patient-service
      - appointment-service
      - clinical-service
      - notification-service

volumes:
  postgres-data:
  rabbitmq-data:
