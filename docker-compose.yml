services:
  gateway:
    build:
      context: ./deploy/gateway
    image: clinicflow/gateway:local
    environment:
      CLINICFLOW_GATEWAY_TLS: "true"
      CLINICFLOW_GATEWAY_HTTPS_PORT: "${CLINICFLOW_GATEWAY_HTTPS_PORT:-443}"
    ports:
      - "${CLINICFLOW_GATEWAY_HTTP_PORT:-80}:8000"
      - "${CLINICFLOW_GATEWAY_HTTPS_PORT:-443}:8443"
    volumes:
      - ./secrets/edge/edge.crt:/certs/edge.crt:ro
      - ./secrets/edge/edge.key:/certs/edge.key:ro
    group_add: ["${CLINICFLOW_TLS_GROUP:-65532}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    deploy:
      resources:
        limits: {cpus: '0.5', memory: 256M}
        reservations: {cpus: '0.1', memory: 128M}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # Platform and service credentials are generated by scripts/generate-dev-credentials.ps1 (ADR-026).
  # Only the platform containers below read the administrator files; each service reads its own file.
  # Built from the official image without gosu and run as its postgres user, UID 70 (ADR-028).
  postgres:
    build:
      context: ./docker/postgres
      target: server
    image: clinicflow/postgres:local
    env_file:
      - path: ./secrets/platform/postgres.env
        required: false
    environment:
      POSTGRES_DB: clinicflow
    ports:
      - "${CLINICFLOW_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./deploy/helm/platform/files/bootstrap:/platform-bootstrap:ro
    # Re-applies the administrator password on every start, so existing volumes pick up a rotation.
    post_start:
      - command: ["sh", "/platform-bootstrap/sync-postgres-admin.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-bootstrap:
    build:
      context: ./docker/postgres
      target: bootstrap
    image: clinicflow/postgres-bootstrap:local
    # The credential files are owner-only (600, in a 700 directory) and owned by the host user, so
    # UID 70 cannot read them on Linux. This one-shot psql client runs as root with every capability
    # dropped except DAC_READ_SEARCH, which only lets it read them; it never starts PostgreSQL (ADR-028).
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ./secrets/platform/postgres.env
        required: false
      # Keycloak's database login only; its admin and client secrets stay with Keycloak.
      - path: ./secrets/keycloak/database.env
        required: false
    environment:
      PGHOST: postgres
      PGDATABASE: clinicflow
    volumes:
      - ./docker/postgres/bootstrap:/bootstrap:ro
      - ./deploy/helm/platform/files/bootstrap:/platform-bootstrap:ro
      - ./secrets/services:/credentials:ro
    command:
      - sh
      - -ec
      - |
        export PGUSER="$$POSTGRES_USER" PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -v ON_ERROR_STOP=1 -f /bootstrap/01-ensure-databases.sql
        psql -v ON_ERROR_STOP=1 -d clinicflow_patient -f /bootstrap/02-sanitize-patient-phone-data.sql
        : "$${KC_DB_PASSWORD:?No Keycloak database login; run scripts/generate-dev-credentials.ps1.}"
        sh /platform-bootstrap/provision-postgres.sh
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
    env_file:
      - path: ./secrets/platform/rabbitmq.env
        required: false
    ports:
      - "${CLINICFLOW_RABBITMQ_PORT:-5672}:5672"
      - "${CLINICFLOW_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/helm/platform/files/bootstrap:/platform-bootstrap:ro
    # Re-applies the administrator password on every start, so existing volumes pick up a rotation.
    post_start:
      - command: ["sh", "/platform-bootstrap/sync-rabbitmq-admin.sh"]
        # rabbitmqctl must run as the node's user to share its Erlang cookie.
        user: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-bootstrap:
    image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
    env_file:
      - path: ./secrets/platform/rabbitmq.env
        required: false
    environment:
      RABBITMQADMIN_TARGET_HOST: rabbitmq
      RABBITMQADMIN_TARGET_PORT: "15672"
    volumes:
      - ./deploy/helm/platform/files/bootstrap:/platform-bootstrap:ro
      - ./secrets/services:/credentials:ro
    entrypoint:
      - sh
      - -ec
      - |
        export RABBITMQADMIN_USERNAME="$$RABBITMQ_DEFAULT_USER" RABBITMQADMIN_PASSWORD="$$RABBITMQ_DEFAULT_PASS"
        exec sh /platform-bootstrap/provision-rabbitmq.sh
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"

  # Identity provider (ADR-027), built from the official image with the clinicflow realm inside.
  # The realm is imported on the first start only; scripts/reset-keycloak-realm.ps1 applies changes.
  # Its database login, bootstrap administrator and BFF client secret are generated (ADR-026).
  keycloak:
    build:
      context: ./docker/keycloak
    image: clinicflow/keycloak:local
    env_file:
      - path: ./secrets/keycloak/database.env
        required: false
      - path: ./secrets/keycloak/admin.env
        required: false
      - path: ./secrets/keycloak/clinicflow-bff.env
        required: false
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/clinicflow_keycloak
      # One public issuer for the browser, the BFF and the services. Callers on the private network
      # use http://keycloak:8080 for tokens and keys, and still get the public iss.
      KC_HOSTNAME: http://localhost:${CLINICFLOW_KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      # Realm placeholders. The demo password is synthetic and documented in local-development.md.
      CLINICFLOW_PUBLIC_URL: ${CLINICFLOW_PUBLIC_URL:-https://clinicflow.localhost}
      CLINICFLOW_DEMO_PASSWORD: ${CLINICFLOW_DEMO_PASSWORD:-ClinicFlowDemo!2026}
    ports:
      # Public URL and admin console, reachable from this machine only.
      - "127.0.0.1:${CLINICFLOW_KEYCLOAK_PORT:-8180}:8080"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Without a limit the JVM sizes its heap from the whole VM.
    deploy:
      resources:
        limits: {memory: 768M}
    healthcheck:
      test: ["CMD", "/opt/clinicflow/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 6
      # The first start creates the schema and imports the realm.
      start_period: 180s
      start_interval: 2s
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  # auth-service and the BFF mount only the JWT files they need, never the whole secrets/ directory.
  # The other services trust Keycloak only (ADR-027): iss is the public issuer, keys come from the
  # private-network JWKS, fetched on the first request, so they do not wait for Keycloak to start.
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    env_file:
      - path: ./secrets/services/auth-service.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_auth
      CLINICFLOW_SECURITY_JWT_ISSUER: clinicflow-auth
      CLINICFLOW_SECURITY_JWT_PRIVATE_KEY_PATH: /run/secrets/clinicflow/jwt-private.pem
      CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH: /run/secrets/clinicflow/jwt-public.pem
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    volumes:
      - {type: bind, source: ./secrets/jwt-private.pem, target: /run/secrets/clinicflow/jwt-private.pem, read_only: true}
      - {type: bind, source: ./secrets/jwt-public.pem, target: /run/secrets/clinicflow/jwt-public.pem, read_only: true}
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  patient-service:
    build:
      context: .
      dockerfile: patient-service/Dockerfile
    env_file:
      - path: ./secrets/services/patient-service.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_patient
      SPRING_RABBITMQ_HOST: rabbitmq
      CLINICFLOW_OIDC_ISSUER: http://localhost:${CLINICFLOW_KEYCLOAK_PORT:-8180}/realms/clinicflow
      CLINICFLOW_OIDC_JWKS_URI: http://keycloak:8080/realms/clinicflow/protocol/openid-connect/certs
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq-bootstrap:
        condition: service_completed_successfully

  appointment-service:
    build:
      context: .
      dockerfile: appointment-service/Dockerfile
    env_file:
      - path: ./secrets/services/appointment-service.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_appointment
      CLINICFLOW_SERVICES_PATIENT_BASE_URL: http://patient-service:8082
      SPRING_RABBITMQ_HOST: rabbitmq
      CLINICFLOW_OIDC_ISSUER: http://localhost:${CLINICFLOW_KEYCLOAK_PORT:-8180}/realms/clinicflow
      CLINICFLOW_OIDC_JWKS_URI: http://keycloak:8080/realms/clinicflow/protocol/openid-connect/certs
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq-bootstrap:
        condition: service_completed_successfully

  clinical-service:
    build:
      context: .
      dockerfile: clinical-service/Dockerfile
    env_file:
      - path: ./secrets/services/clinical-service.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_clinical
      CLINICFLOW_SERVICES_PATIENT_BASE_URL: http://patient-service:8082
      CLINICFLOW_SERVICES_APPOINTMENT_BASE_URL: http://appointment-service:8083
      SPRING_RABBITMQ_HOST: rabbitmq
      CLINICFLOW_OIDC_ISSUER: http://localhost:${CLINICFLOW_KEYCLOAK_PORT:-8180}/realms/clinicflow
      CLINICFLOW_OIDC_JWKS_URI: http://keycloak:8080/realms/clinicflow/protocol/openid-connect/certs
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq-bootstrap:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    env_file:
      - path: ./secrets/services/notification-service.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinicflow_notification
      SPRING_RABBITMQ_HOST: rabbitmq
      CLINICFLOW_OIDC_ISSUER: http://localhost:${CLINICFLOW_KEYCLOAK_PORT:-8180}/realms/clinicflow
      CLINICFLOW_OIDC_JWKS_URI: http://keycloak:8080/realms/clinicflow/protocol/openid-connect/certs
      CLINICFLOW_DEMO_BOOTSTRAP_ENABLED: "true"
      MANAGEMENT_SERVER_PORT: "9000"
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      rabbitmq-bootstrap:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      GATEWAY_URL: http://gateway:8080
      AUTH_SERVICE_HEALTH_URL: http://auth-service:9000
      PATIENT_SERVICE_HEALTH_URL: http://patient-service:9000
      APPOINTMENT_SERVICE_HEALTH_URL: http://appointment-service:9000
      CLINICAL_SERVICE_HEALTH_URL: http://clinical-service:9000
      NOTIFICATION_SERVICE_HEALTH_URL: http://notification-service:9000
      CLINICFLOW_AUTH_COOKIE_SECURE: "true"
      # The BFF is a confidential OIDC client (ADR-027): the browser signs in on the public issuer, and the
      # BFF exchanges codes, refreshes and reads keys on the private network.
      CLINICFLOW_OIDC_ISSUER: http://localhost:${CLINICFLOW_KEYCLOAK_PORT:-8180}/realms/clinicflow
      CLINICFLOW_OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/clinicflow
      # Must match a redirect URI registered on the realm's BFF client.
      CLINICFLOW_PUBLIC_URL: ${CLINICFLOW_PUBLIC_URL:-https://clinicflow.localhost}
    env_file:
      - path: ./secrets/keycloak/clinicflow-bff.env
        required: false
    depends_on:
      - auth-service
      - patient-service
      - appointment-service
      - clinical-service
      - notification-service

volumes:
  postgres-data:
  rabbitmq-data:
