# Last override after docker-compose.yml and docker-compose.ci.yml.
# No security target publishes host ports or uses workstation TLS or JWT material; database and
# broker logins come from the generated, Git-ignored credential files (ADR-026).
services:
  certificate-bootstrap:
    image: alpine/openssl:3.5.8@sha256:3f25da71f70eba788067daac3f3df03bd1de7a7c52ed89fa93b94ad2c92d986b
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/ca.key -out /certs/ca.crt -days 1 -subj '/CN=ClinicFlow ephemeral DAST CA' -addext 'basicConstraints=critical,CA:TRUE'
        openssl req -new -newkey rsa:2048 -nodes -keyout /certs/edge.key -out /tmp/edge.csr -subj '/CN=clinicflow.localhost'
        printf '%s\n' 'subjectAltName=DNS:clinicflow.localhost,DNS:api.clinicflow.localhost' 'extendedKeyUsage=serverAuth' 'basicConstraints=critical,CA:FALSE' > /tmp/edge.ext
        openssl x509 -req -in /tmp/edge.csr -CA /certs/ca.crt -CAkey /tmp/ca.key -CAcreateserial -out /certs/edge.crt -days 1 -extfile /tmp/edge.ext
        chmod 644 /certs/edge.crt /certs/ca.crt
        chown 65532:65532 /certs/edge.key
        chmod 400 /certs/edge.key
        chown 1000:1000 /reports
    volumes: [dast-certificates:/certs, dast-reports:/reports]
    restart: "no"
  gateway:
    environment:
      CLINICFLOW_GATEWAY_TLS: "true"
      CLINICFLOW_GATEWAY_HTTPS_PORT: "8443"
    ports: !override []
    volumes: !override [dast-certificates:/certs:ro]
    networks:
      default:
        aliases: [clinicflow.localhost, api.clinicflow.localhost]
    depends_on:
      certificate-bootstrap: {condition: service_completed_successfully}
  postgres:
    ports: !override []
  rabbitmq:
    ports: !override []
  keycloak:
    ports: !override []
    environment:
      CLINICFLOW_PUBLIC_URL: https://clinicflow.localhost:8443
  frontend:
    environment:
      CLINICFLOW_AUTH_COOKIE_SECURE: "true"
      CLINICFLOW_PUBLIC_URL: https://clinicflow.localhost:8443
  zap:
    profiles: [security]
    build:
      context: .
      dockerfile: deploy/security/Dockerfile
    image: clinicflow/zap:${CLINICFLOW_SECURITY_TAG:?Set an isolated security tag}
    env_file:
      # The BFF client secret: DAST signs in to Keycloak on the private network for API tokens (ADR-027).
      - path: ./secrets/keycloak/clinicflow-bff.env
        required: false
    environment:
      CLINICFLOW_DEMO_PASSWORD: ${CLINICFLOW_DEMO_PASSWORD:-ClinicFlowDemo!2026}
      DAST_COMPONENTS: ${DAST_COMPONENTS:-auth-service,patient-service,appointment-service,clinical-service,notification-service,frontend}
      DAST_FULL_SCAN: ${DAST_FULL_SCAN:-false}
      DAST_SMOKE_ONLY: ${DAST_SMOKE_ONLY:-false}
    volumes:
      - dast-certificates:/certs:ro
      - dast-reports:/zap/wrk/reports
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  dast-certificates:
  dast-reports:
