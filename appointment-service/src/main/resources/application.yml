server:
  port: 8083

spring:
  application:
    name: appointment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow_appointment}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:clinicflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:clinicflow}
    password: ${SPRING_RABBITMQ_PASSWORD:clinicflow}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
  level:
    com.clinicflow: INFO

clinicflow:
  security:
    jwt:
      issuer: ${CLINICFLOW_SECURITY_JWT_ISSUER:clinicflow-auth}
      public-key: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY:}
      public-key-path: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH:}
  messaging:
    exchange: therapy.events.exchange
  services:
    connect-timeout: ${CLINICFLOW_SERVICES_CONNECT_TIMEOUT:1s}
    read-timeout: ${CLINICFLOW_SERVICES_READ_TIMEOUT:2s}
    patient:
      base-url: ${CLINICFLOW_SERVICES_PATIENT_BASE_URL:http://localhost:8082}
  outbox:
    enabled: ${CLINICFLOW_OUTBOX_ENABLED:true}
    poll-interval: ${CLINICFLOW_OUTBOX_POLL_INTERVAL:1s}
    batch-size: ${CLINICFLOW_OUTBOX_BATCH_SIZE:20}
    confirm-timeout: ${CLINICFLOW_OUTBOX_CONFIRM_TIMEOUT:5s}
    retry-initial: ${CLINICFLOW_OUTBOX_RETRY_INITIAL:1s}
    retry-max: ${CLINICFLOW_OUTBOX_RETRY_MAX:1m}
    cleanup-interval: ${CLINICFLOW_OUTBOX_CLEANUP_INTERVAL:1h}
    published-retention: ${CLINICFLOW_OUTBOX_PUBLISHED_RETENTION:7d}
