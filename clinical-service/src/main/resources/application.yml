server:
  port: 8085

spring:
  application:
    name: clinical-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow_clinical}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:clinicflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:clinicflow}
    password: ${SPRING_RABBITMQ_PASSWORD:clinicflow}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
  level:
    com.clinicflow: INFO

clinicflow:
  security:
    jwt:
      issuer: ${CLINICFLOW_SECURITY_JWT_ISSUER:clinicflow-auth}
      public-key: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY:}
      public-key-path: ${CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH:}
  services:
    connect-timeout: ${CLINICFLOW_SERVICES_CONNECT_TIMEOUT:1s}
    read-timeout: ${CLINICFLOW_SERVICES_READ_TIMEOUT:2s}
    patient:
      base-url: ${CLINICFLOW_SERVICES_PATIENT_BASE_URL:http://localhost:8082}
    appointment:
      base-url: ${CLINICFLOW_SERVICES_APPOINTMENT_BASE_URL:http://localhost:8083}
  messaging:
    exchange: therapy.events.exchange
    dead-letter-exchange: therapy.events.dlx
    dead-letter-routing-key: clinical.failed
    clinical-queue: clinical.appointment-events.queue
    clinical-dlq: clinical.appointment-events.dlq
    retry:
      max-attempts: 4
      initial-interval: 1s
      multiplier: 2
      max-interval: 10s
