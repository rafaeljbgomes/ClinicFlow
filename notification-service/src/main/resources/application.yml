server:
  port: 8084

spring:
  application:
    name: notification-service
  # Keycloak tokens (ADR-027): keys come from the private-network JWKS, iss must be the public issuer.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${CLINICFLOW_OIDC_ISSUER:http://localhost:8180/realms/clinicflow}
          jwk-set-uri: ${CLINICFLOW_OIDC_JWKS_URI:http://localhost:8180/realms/clinicflow/protocol/openid-connect/certs}
          audiences: [clinicflow-api]
          authorities-claim-name: roles
          authority-prefix: ROLE_
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clinicflow_notification}
    username: ${SPRING_DATASOURCE_USERNAME:clinicflow}
    password: ${SPRING_DATASOURCE_PASSWORD:clinicflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:clinicflow}
    password: ${SPRING_RABBITMQ_PASSWORD:clinicflow}

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
  level:
    com.clinicflow: INFO

clinicflow:
  messaging:
    exchange: therapy.events.exchange
    dead-letter-exchange: therapy.events.dlx
    dead-letter-routing-key: notification.failed
    notification-queue: notification.events.queue
    notification-dlq: notification.events.dlq
    retry:
      max-attempts: 4
      initial-interval: 1s
      multiplier: 2
      max-interval: 10s
