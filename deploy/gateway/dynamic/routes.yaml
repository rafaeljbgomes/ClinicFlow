# Generated by scripts/gateway/render-config.py; edit deploy/gateway/routes.json.
{{ $tls := ne (env "CLINICFLOW_GATEWAY_TLS") "false" }}
http:
  routers:
    public-patients:
      rule: "Host(`api.clinicflow.localhost`) && (Path(`/api/v1/patients`) || PathPrefix(`/api/v1/patients/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: patient-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, patients-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-patients:
      rule: "(Path(`/api/v1/patients`) || PathPrefix(`/api/v1/patients/`))"
      entryPoints: [api]
      service: patient-service
      middlewares: [headers, patients-rewrite, internal-limit]
    public-appointments:
      rule: "Host(`api.clinicflow.localhost`) && (Path(`/api/v1/appointments`) || PathPrefix(`/api/v1/appointments/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: appointment-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, appointments-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-appointments:
      rule: "(Path(`/api/v1/appointments`) || PathPrefix(`/api/v1/appointments/`))"
      entryPoints: [api]
      service: appointment-service
      middlewares: [headers, appointments-rewrite, internal-limit]
    public-clinical-cases:
      rule: "Host(`api.clinicflow.localhost`) && (Path(`/api/v1/clinical/clinical-cases`) || PathPrefix(`/api/v1/clinical/clinical-cases/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: clinical-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, clinical-cases-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-clinical-cases:
      rule: "(Path(`/api/v1/clinical/clinical-cases`) || PathPrefix(`/api/v1/clinical/clinical-cases/`))"
      entryPoints: [api]
      service: clinical-service
      middlewares: [headers, clinical-cases-rewrite, internal-limit]
    public-clinical-sessions:
      rule: "Host(`api.clinicflow.localhost`) && (Path(`/api/v1/clinical/session-records`) || PathPrefix(`/api/v1/clinical/session-records/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: clinical-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, clinical-sessions-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-clinical-sessions:
      rule: "(Path(`/api/v1/clinical/session-records`) || PathPrefix(`/api/v1/clinical/session-records/`))"
      entryPoints: [api]
      service: clinical-service
      middlewares: [headers, clinical-sessions-rewrite, internal-limit]
    public-clinical-profile:
      rule: "Host(`api.clinicflow.localhost`) && Path(`/api/v1/clinical/practice-profile`)"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: clinical-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, clinical-profile-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-clinical-profile:
      rule: "Path(`/api/v1/clinical/practice-profile`)"
      entryPoints: [api]
      service: clinical-service
      middlewares: [headers, clinical-profile-rewrite, internal-limit]
    public-clinical-history:
      rule: "Host(`api.clinicflow.localhost`) && (Path(`/api/v1/clinical/patients`) || PathPrefix(`/api/v1/clinical/patients/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: clinical-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, clinical-history-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-clinical-history:
      rule: "(Path(`/api/v1/clinical/patients`) || PathPrefix(`/api/v1/clinical/patients/`))"
      entryPoints: [api]
      service: clinical-service
      middlewares: [headers, clinical-history-rewrite, internal-limit]
    public-notifications:
      rule: "Host(`api.clinicflow.localhost`) && (Path(`/api/v1/notifications`) || PathPrefix(`/api/v1/notifications/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: notification-service
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, notifications-rewrite, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    internal-notifications:
      rule: "(Path(`/api/v1/notifications`) || PathPrefix(`/api/v1/notifications/`))"
      entryPoints: [api]
      service: notification-service
      middlewares: [headers, notifications-rewrite, internal-limit]
    ui:
      rule: "Host(`clinicflow.localhost`){{ if not $tls }} || Host(`127.0.0.1`) || Host(`host.docker.internal`) || Host(`localhost`){{ end }}"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: frontend
      priority: 1
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}]
{{ if $tls }}
      tls: {}
{{ end }}
    bff-api:
      rule: "(Host(`clinicflow.localhost`){{ if not $tls }} || Host(`127.0.0.1`) || Host(`host.docker.internal`) || Host(`localhost`){{ end }}) && (Path(`/api`) || PathPrefix(`/api/`))"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: frontend
      priority: 50
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, public-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    bff-login:
      rule: "(Host(`clinicflow.localhost`){{ if not $tls }} || Host(`127.0.0.1`) || Host(`host.docker.internal`) || Host(`localhost`){{ end }}) && Path(`/api/auth/login`)"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: frontend
      priority: 100
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, auth-limit]
{{ if $tls }}
      tls: {}
{{ end }}
    bff-register:
      rule: "(Host(`clinicflow.localhost`){{ if not $tls }} || Host(`127.0.0.1`) || Host(`host.docker.internal`) || Host(`localhost`){{ end }}) && Path(`/api/auth/register`)"
      entryPoints: [{{ if $tls }}websecure{{ else }}web{{ end }}]
      service: frontend
      priority: 100
      middlewares: [{{ if $tls }}secure-headers{{ else }}headers{{ end }}, auth-limit]
{{ if $tls }}
      tls: {}
{{ end }}
{{ if $tls }}
    redirect:
      rule: "Host(`clinicflow.localhost`) || Host(`api.clinicflow.localhost`)"
      entryPoints: [web]
      service: noop@internal
      middlewares: [https-redirect]
{{ end }}
  middlewares:
    patients-rewrite:
      replacePathRegex:
        regex: "^/api/v1/patients(/.*)?$"
        replacement: "/patients${1}"
    appointments-rewrite:
      replacePathRegex:
        regex: "^/api/v1/appointments(/.*)?$"
        replacement: "/appointments${1}"
    clinical-cases-rewrite:
      replacePathRegex:
        regex: "^/api/v1/clinical/clinical-cases(/.*)?$"
        replacement: "/clinical-cases${1}"
    clinical-sessions-rewrite:
      replacePathRegex:
        regex: "^/api/v1/clinical/session-records(/.*)?$"
        replacement: "/session-records${1}"
    clinical-profile-rewrite:
      replacePath:
        path: /practice-profile
    clinical-history-rewrite:
      replacePathRegex:
        regex: "^/api/v1/clinical/patients(/.*)?$"
        replacement: "/patients${1}"
    notifications-rewrite:
      replacePathRegex:
        regex: "^/api/v1/notifications(/.*)?$"
        replacement: "/notifications${1}"
    headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
    secure-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        stsSeconds: 86400
    https-redirect:
      redirectScheme:
        scheme: https
        port: "{{ env "CLINICFLOW_GATEWAY_HTTPS_PORT" | default "443" }}"
        permanent: true
    public-limit:
      rateLimit:
        average: {{ env "CLINICFLOW_GATEWAY_PUBLIC_AVERAGE" | default "20" }}
        period: {{ env "CLINICFLOW_GATEWAY_PUBLIC_PERIOD" | default "1s" }}
        burst: {{ env "CLINICFLOW_GATEWAY_PUBLIC_BURST" | default "40" }}
    auth-limit:
      rateLimit:
        average: {{ env "CLINICFLOW_GATEWAY_AUTH_AVERAGE" | default "10" }}
        period: {{ env "CLINICFLOW_GATEWAY_AUTH_PERIOD" | default "1m" }}
        burst: {{ env "CLINICFLOW_GATEWAY_AUTH_BURST" | default "5" }}
    internal-limit:
      rateLimit:
        average: {{ env "CLINICFLOW_GATEWAY_INTERNAL_AVERAGE" | default "100" }}
        period: {{ env "CLINICFLOW_GATEWAY_INTERNAL_PERIOD" | default "1s" }}
        burst: {{ env "CLINICFLOW_GATEWAY_INTERNAL_BURST" | default "200" }}
  services:
    appointment-service:
      loadBalancer:
        servers:
          - url: http://appointment-service:8083
    clinical-service:
      loadBalancer:
        servers:
          - url: http://clinical-service:8085
    frontend:
      loadBalancer:
        servers:
          - url: http://frontend:3000
    notification-service:
      loadBalancer:
        servers:
          - url: http://notification-service:8084
    patient-service:
      loadBalancer:
        servers:
          - url: http://patient-service:8082
{{ if $tls }}
tls:
  certificates:
    - certFile: /certs/edge.crt
      keyFile: /certs/edge.key
  options:
    default:
      minVersion: VersionTLS12
{{ end }}
