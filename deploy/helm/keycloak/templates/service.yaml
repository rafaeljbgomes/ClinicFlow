# http://keycloak:8080, the private-network URL the BFF and the services use in Compose and here
# alike (ADR-027). Only the HTTP port: the management port stays on the chart's keycloak-http Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    {{- include "clinicflow-keycloak.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  selector:
    {{- include "clinicflow-keycloak.podSelector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
