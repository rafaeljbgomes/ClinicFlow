name: frontend

image:
  repository: clinicflow/frontend
  tag: "0.1.0-local"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1
port: 3000
gatewayUrl: http://clinicflow-gateway-api.ingress-system.svc.cluster.local:8080
cookieSecure: true
gatewayNamespace: ingress-system

services:
  auth:
    healthUrl: http://auth-service:9000
  patient:
    healthUrl: http://patient-service:9000
  appointment:
    healthUrl: http://appointment-service:9000
  clinical:
    healthUrl: http://clinical-service:9000
  notification:
    healthUrl: http://notification-service:9000

# The BFF is a confidential OIDC client of the Keycloak realm (ADR-027). The browser uses the public
# issuer; codes, refreshes and keys go to Keycloak on the cluster network. Keycloak arrives with #89.
oidc:
  issuer: https://auth.clinicflow.localhost/realms/clinicflow
  internalIssuer: http://keycloak:8080/realms/clinicflow
  # The BFF's public origin; its /api/auth/callback must be a redirect URI of the realm's BFF client.
  publicUrl: https://clinicflow.localhost
  clientSecretName: clinicflow-bff-oidc
  clientSecretKey: CLINICFLOW_BFF_CLIENT_SECRET
  # A digest of that Secret; a rotated client secret rolls the BFF (ADR-026).
  clientSecretChecksum: ""
  # The in-cluster Keycloak pods (app.kubernetes.io/component) and HTTP port the egress rule allows.
  component: keycloak
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# UID/GID 10001 matches the non-root nextjs user in the frontend image.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: true
