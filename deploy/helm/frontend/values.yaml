name: frontend

image:
  repository: clinicflow/frontend
  tag: "0.1.0-local"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1
port: 3000
gatewayUrl: http://clinicflow-gateway-api.ingress-system.svc.cluster.local:8080
cookieSecure: true
gatewayNamespace: ingress-system

services:
  auth:
    healthUrl: http://auth-service:9000
  patient:
    healthUrl: http://patient-service:9000
  appointment:
    healthUrl: http://appointment-service:9000
  clinical:
    healthUrl: http://clinical-service:9000
  notification:
    healthUrl: http://notification-service:9000

jwt:
  issuer: clinicflow-auth
  secretName: clinicflow-jwt
  publicKeyKey: jwt-public.pem

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

networkPolicy:
  enabled: true
