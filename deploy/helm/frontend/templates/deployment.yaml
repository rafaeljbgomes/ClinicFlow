apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "clinicflow-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "clinicflow-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clinicflow-frontend.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.name }}
    spec:
      containers:
        - name: frontend
          image: {{ include "clinicflow-frontend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ include "clinicflow-frontend.configName" . }}
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
