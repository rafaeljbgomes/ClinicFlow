apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "clinicflow-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "clinicflow-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "clinicflow-frontend.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "clinicflow-frontend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ include "clinicflow-frontend.configName" . }}
          env:
            - name: CLINICFLOW_SECURITY_JWT_ISSUER
              value: {{ .Values.jwt.issuer | quote }}
            - name: CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH
              value: /run/secrets/clinicflow/jwt-public.pem
          volumeMounts:
            - name: jwt-public-key
              mountPath: /run/secrets/clinicflow
              readOnly: true
            # The root filesystem is read-only; Next.js writes its cache and temporary files here.
            - name: next-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: next-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: jwt-public-key
          secret:
            secretName: {{ .Values.jwt.secretName }}
            items:
              - key: {{ .Values.jwt.publicKeyKey }}
                path: jwt-public.pem
