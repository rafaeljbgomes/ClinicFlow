apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "clinicflow-frontend.labels" . | nindent 4 }}
spec:
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
  selector:
    {{- include "clinicflow-frontend.selectorLabels" . | nindent 4 }}
