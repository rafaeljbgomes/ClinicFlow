apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinicflow-frontend.configName" . }}
  labels:
    {{- include "clinicflow-frontend.labels" . | nindent 4 }}
data:
  GATEWAY_URL: {{ required "gatewayUrl is required for deployed BFF traffic" .Values.gatewayUrl | quote }}
  CLINICFLOW_AUTH_COOKIE_SECURE: {{ .Values.cookieSecure | quote }}
  AUTH_SERVICE_HEALTH_URL: {{ .Values.services.auth.healthUrl | quote }}
  PATIENT_SERVICE_HEALTH_URL: {{ .Values.services.patient.healthUrl | quote }}
  APPOINTMENT_SERVICE_HEALTH_URL: {{ .Values.services.appointment.healthUrl | quote }}
  CLINICAL_SERVICE_HEALTH_URL: {{ .Values.services.clinical.healthUrl | quote }}
  NOTIFICATION_SERVICE_HEALTH_URL: {{ .Values.services.notification.healthUrl | quote }}
