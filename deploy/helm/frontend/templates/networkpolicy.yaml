{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      {{- include "clinicflow-frontend.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}}
          podSelector:
            matchLabels: {clinicflow.io/edge: gateway}
      ports: [{port: 3000, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.gatewayNamespace }}}
          podSelector:
            matchLabels: {clinicflow.io/edge: gateway}
      ports: [{port: 8080, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [auth-service, patient-service, appointment-service, clinical-service, notification-service]
      ports: [{port: 9000, protocol: TCP}]
{{- end }}
