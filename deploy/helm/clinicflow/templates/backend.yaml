{{- range $key, $service := .Values.backend.services }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "clinicflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
    clinicflow.io/metrics: spring
spec:
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
  selector:
    app.kubernetes.io/component: {{ $service.name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $service.name }}
  labels:
    {{- include "clinicflow.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "clinicflow.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      containers:
        - name: {{ $service.name }}
          image: "{{ $service.image }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
            - name: management
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: {{ include "clinicflow.configName" $ }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ $.Values.postgres.name }}:5432/{{ $service.database }}"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "clinicflow.postgresSecretName" $ }}
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clinicflow.postgresSecretName" $ }}
                  key: password
            {{- if $service.rabbitmq }}
            - name: SPRING_RABBITMQ_HOST
              value: {{ $.Values.rabbitmq.name | quote }}
            - name: SPRING_RABBITMQ_PORT
              value: "5672"
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "clinicflow.rabbitmqSecretName" $ }}
                  key: username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "clinicflow.rabbitmqSecretName" $ }}
                  key: password
            {{- end }}
            - name: CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH
              value: /run/secrets/clinicflow/jwt-public.pem
            {{- if $service.jwtPrivateKey }}
            - name: CLINICFLOW_SECURITY_JWT_PRIVATE_KEY_PATH
              value: /run/secrets/clinicflow/jwt-private.pem
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: jwt
              mountPath: /run/secrets/clinicflow
              readOnly: true
      volumes:
        - name: jwt
          secret:
            secretName: {{ $.Values.security.jwt.existingSecret }}
            items:
              - key: {{ $.Values.security.jwt.publicKeyKey }}
                path: jwt-public.pem
              {{- if $service.jwtPrivateKey }}
              - key: {{ $.Values.security.jwt.privateKeyKey }}
                path: jwt-private.pem
              {{- end }}
---
{{- end }}
