{{- if .Values.grafanaDashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinicflow-grafana-dashboard
  labels:
    {{ .Values.grafanaDashboards.label }}: "1"
    {{- include "clinicflow.labels" . | nindent 4 }}
data:
  clinicflow-platform.json: |
    {
      "uid": "clinicflow-platform",
      "title": "ClinicFlow Platform",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "tags": ["clinicflow", "kubernetes", "portfolio"],
      "timezone": "browser",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "ClinicFlow targets UP",
          "gridPos": {"h": 4, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum(up{namespace=\"{{ .Release.Namespace }}\"})", "refId": "A"}
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP requests by application",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (application, status) (rate(http_server_requests_seconds_count{namespace=\"{{ .Release.Namespace }}\"}[5m]))", "refId": "A"}
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Domain events published",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (service, event_type, status) (rate(clinicflow_domain_events_published_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))", "refId": "A"}
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Domain events consumed",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (service, event_type, status) (rate(clinicflow_domain_events_consumed_total{namespace=\"{{ .Release.Namespace }}\"}[5m]))", "refId": "A"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "RabbitMQ queued messages",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"expr": "sum by (queue) (rabbitmq_queue_messages_ready{namespace=\"{{ .Release.Namespace }}\"})", "refId": "A"}
          ]
        }
      ]
    }
{{- end }}
