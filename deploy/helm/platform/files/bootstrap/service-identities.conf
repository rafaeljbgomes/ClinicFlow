# Service identities provisioned by the platform bootstrap (ADR-026).
# Read by provision-postgres.sh, provision-rabbitmq.sh, the platform chart and
# scripts/generate-dev-credentials.ps1, so a service is added here once.
#
# Columns: service, database, then the RabbitMQ configure, write and read
# permission patterns on vhost "/". "-" means the service has no broker access.
# Each pattern lists exactly the exchanges and queues the service declares,
# binds, publishes to or consumes; see https://www.rabbitmq.com/docs/access-control.
auth-service          clinicflow_auth          -  -  -
patient-service       clinicflow_patient       ^therapy\.events\.exchange$  ^therapy\.events\.exchange$  ^$
appointment-service   clinicflow_appointment   ^therapy\.events\.exchange$  ^therapy\.events\.exchange$  ^$
clinical-service      clinicflow_clinical      ^(therapy\.events\.(exchange|dlx)|clinical\.appointment-events\.(queue|dlq))$  ^(therapy\.events\.dlx|clinical\.appointment-events\.(queue|dlq))$  ^(therapy\.events\.(exchange|dlx)|clinical\.appointment-events\.queue)$
notification-service  clinicflow_notification  ^(therapy\.events\.(exchange|dlx)|notification\.events\.(queue|dlq))$  ^(therapy\.events\.dlx|notification\.events\.(queue|dlq))$  ^(therapy\.events\.(exchange|dlx)|notification\.events\.queue)$
