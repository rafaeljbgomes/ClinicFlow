# Service identities provisioned by the platform bootstrap (ADR-026).
# Read by provision-postgres.sh, provision-rabbitmq.sh, the platform chart and
# scripts/generate-dev-credentials.ps1, so a service is added here once.
#
# Columns, separated by spaces (patterns contain none):
#   1. service
#   2. database
#   3-5. RabbitMQ configure, write and read patterns on vhost "/" for exchange and queue names.
#        Each lists exactly the exchanges and queues the service declares, binds, publishes to
#        or consumes; see https://www.rabbitmq.com/docs/access-control.
#   6-7. RabbitMQ topic write and read patterns on the shared topic exchanges
#        (therapy.events.exchange and therapy.events.dlx). Write limits the routing keys the
#        service may publish; read limits the binding keys it may bind its queues with.
# "-" in columns 3-7 means the service has no broker access.
auth-service          clinicflow_auth          -  -  -  -  -
patient-service       clinicflow_patient       ^therapy\.events\.exchange$  ^therapy\.events\.exchange$  ^$  ^patient\.created$  ^$
appointment-service   clinicflow_appointment   ^therapy\.events\.exchange$  ^therapy\.events\.exchange$  ^$  ^appointment\.(scheduled|rescheduled|cancelled|completed)$  ^$
clinical-service      clinicflow_clinical      ^(therapy\.events\.(exchange|dlx)|clinical\.appointment-events\.(queue|dlq))$  ^(therapy\.events\.dlx|clinical\.appointment-events\.(queue|dlq))$  ^(therapy\.events\.(exchange|dlx)|clinical\.appointment-events\.queue)$  ^$  ^(appointment\.completed|clinical\.failed)$
notification-service  clinicflow_notification  ^(therapy\.events\.(exchange|dlx)|notification\.events\.(queue|dlq))$  ^(therapy\.events\.dlx|notification\.events\.(queue|dlq))$  ^(therapy\.events\.(exchange|dlx)|notification\.events\.queue)$  ^$  ^(patient\.created|appointment\.(scheduled|rescheduled|cancelled)|notification\.failed)$
