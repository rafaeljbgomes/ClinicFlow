{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clinicflow-rabbitmq
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      clinicflow.io/metrics: rabbitmq
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: prometheus
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
