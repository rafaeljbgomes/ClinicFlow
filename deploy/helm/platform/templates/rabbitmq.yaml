apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.rabbitmq.name }}
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
    clinicflow.io/metrics: rabbitmq
spec:
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: prometheus
      port: 15692
      targetPort: prometheus
  selector:
    app.kubernetes.io/component: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.rabbitmq.name }}
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  serviceName: {{ .Values.rabbitmq.name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "clinicflow-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
      {{- with .Values.rabbitmq.credentialsChecksum }}
      annotations:
        clinicflow.io/credentials-checksum: {{ . | quote }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.rabbitmq.podSecurityContext | nindent 8 }}
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.rabbitmq.securityContext | nindent 12 }}
          command: ["sh", "-c"]
          # /etc/rabbitmq is read-only, so the enabled-plugins list lives on the data volume.
          args:
            - rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus && exec rabbitmq-server
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          envFrom:
            - secretRef:
                name: {{ include "clinicflow-platform.rabbitmqSecretName" . }}
          env:
            - name: RABBITMQ_ENABLED_PLUGINS_FILE
              value: /var/lib/rabbitmq/enabled_plugins
          lifecycle:
            # Re-applies the administrator password on every start, so existing volumes pick up a rotation.
            postStart:
              exec:
                command: ["sh", "/platform-bootstrap/sync-rabbitmq-admin.sh"]
          startupProbe:
            tcpSocket:
              port: amqp
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 15
            failureThreshold: 6
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
            - name: bootstrap
              mountPath: /platform-bootstrap
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: {{ include "clinicflow-platform.bootstrapConfigName" . }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.rabbitmq.storage.size | quote }}
