{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicflow-platform.postgresSecretName" . }}
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
---
{{- end }}
{{- if not .Values.rabbitmq.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicflow-platform.rabbitmqSecretName" . }}
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.rabbitmq.username | quote }}
  password: {{ .Values.rabbitmq.password | quote }}
{{- end }}
