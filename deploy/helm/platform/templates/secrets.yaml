{{- /* Administrator logins only (ADR-026); keys match the images' environment so they load through envFrom. */ -}}
{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicflow-platform.postgresSecretName" . }}
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ required "Set postgres.password or postgres.existingSecret" .Values.postgres.password | quote }}
---
{{- end }}
{{- if not .Values.rabbitmq.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clinicflow-platform.rabbitmqSecretName" . }}
  labels:
    {{- include "clinicflow-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: {{ .Values.rabbitmq.username | quote }}
  RABBITMQ_DEFAULT_PASS: {{ required "Set rabbitmq.password or rabbitmq.existingSecret" .Values.rabbitmq.password | quote }}
{{- end }}
