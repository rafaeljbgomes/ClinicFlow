postgres:
  name: postgres
  image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
  database: clinicflow
  username: clinicflow
  password: clinicflow
  existingSecret: ""
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

rabbitmq:
  name: rabbitmq
  image: rabbitmq:4.3.4-management-alpine@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
  username: clinicflow
  password: clinicflow
  existingSecret: ""
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

grafanaDashboards:
  enabled: true
  label: grafana_dashboard

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
