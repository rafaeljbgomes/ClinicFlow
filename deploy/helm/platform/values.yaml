postgres:
  name: postgres
  image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  database: clinicflow
  username: clinicflow
  password: clinicflow
  existingSecret: ""
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The image's postgres user (70) runs without the gosu privilege drop. No fsGroup: a recursive
  # group change would loosen PGDATA permissions, which PostgreSQL refuses to start with.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

rabbitmq:
  name: rabbitmq
  image: rabbitmq:4.3.6-management-alpine@sha256:3505b6096cdbc083bcc363e74366f575ecd0c1a55be4dadcbc60fa08e34647e1
  username: clinicflow
  password: clinicflow
  existingSecret: ""
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # The image's rabbitmq user (100:101); the data volume holds the Erlang cookie and plugin list.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

grafanaDashboards:
  enabled: true
  label: grafana_dashboard

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
