name: service

image:
  repository: clinicflow/service
  tag: "0.1.0-local"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1
port: 8080
managementPort: 9000

database:
  name: clinicflow
  host: postgres
  port: 5432

rabbitmq:
  enabled: false
  host: rabbitmq
  port: 5672

# This service's own logins (ADR-026), created outside the chart from the generated
# secrets/services/<name>.env. The Secret holds SPRING_DATASOURCE_USERNAME/PASSWORD (runtime role),
# SPRING_FLYWAY_USER/PASSWORD (owner role) and, for messaging services, SPRING_RABBITMQ_USERNAME/PASSWORD.
credentials:
  # Defaults to "<name>-credentials".
  secretName: ""
  # A digest of the Secret's content; when it changes the pods roll so they pick up rotated passwords.
  checksum: ""

# Token validation (ADR-027). Resource servers trust the Keycloak realm only: iss must equal the public
# issuer, and signing keys come from the realm JWKS on the cluster network, fetched on the first request.
oidc:
  enabled: true
  issuer: https://auth.clinicflow.localhost/realms/clinicflow
  jwksUri: http://keycloak:8080/realms/clinicflow/protocol/openid-connect/certs
  # The in-cluster Keycloak pods (app.kubernetes.io/component) and HTTP port the JWKS egress rule allows.
  component: keycloak
  port: 8080

# auth-service only, until it is removed: it signs and checks its own tokens with the PEM key pair.
# A release enables exactly one of oidc and jwt.
jwt:
  enabled: false
  issuer: clinicflow-auth
  secretName: clinicflow-jwt
  publicKeyKey: jwt-public.pem
  privateKeyKey: jwt-private.pem
  privateKeyEnabled: false

environment: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

# UID/GID 10001 matches the non-root user in the service images.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true
  gatewayNamespace: ingress-system
  frontendComponent: frontend
  monitoringNamespace: monitoring
  # Same-namespace service components allowed to call this service's application port.
  serviceIngress: []
  # Same-namespace service components this service calls: [{component: patient-service, port: 8082}].
  serviceEgress: []
