name: service

image:
  repository: clinicflow/service
  tag: "0.1.0-local"
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1
port: 8080
managementPort: 9000

database:
  name: clinicflow
  host: postgres
  port: 5432
  secretName: clinicflow-platform-postgres

rabbitmq:
  enabled: false
  host: rabbitmq
  port: 5672
  secretName: clinicflow-platform-rabbitmq

jwt:
  issuer: clinicflow-auth
  secretName: clinicflow-jwt
  publicKeyKey: jwt-public.pem
  privateKeyKey: jwt-private.pem
  privateKeyEnabled: false

environment: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

# UID/GID 10001 matches the non-root user in the service images.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true
  gatewayNamespace: ingress-system
  frontendComponent: frontend
  monitoringNamespace: monitoring
