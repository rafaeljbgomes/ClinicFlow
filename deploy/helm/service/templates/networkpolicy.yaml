{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      {{- include "clinicflow-service.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}}
          podSelector:
            matchLabels: {clinicflow.io/edge: gateway}
      ports: [{port: {{ .Values.port }}, protocol: TCP}]
    {{- with .Values.networkPolicy.serviceIngress }}
    - from:
        {{- range . }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: {{ . }}}
        {{- end }}
      ports: [{port: {{ $.Values.port }}, protocol: TCP}]
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: {{ .Values.networkPolicy.frontendComponent }}}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports: [{port: {{ .Values.managementPort }}, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: postgres}
      ports: [{port: {{ .Values.database.port }}, protocol: TCP}]
    {{- range .Values.networkPolicy.serviceEgress }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $.Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: {{ .component }}}
      ports: [{port: {{ .port }}, protocol: TCP}]
    {{- end }}
    {{- if .Values.oidc.enabled }}
    # The realm JWKS that signs every accepted token (ADR-027).
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: {{ .Values.oidc.component }}}
      ports: [{port: {{ .Values.oidc.port }}, protocol: TCP}]
    {{- end }}
    {{- if .Values.rabbitmq.enabled }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Release.Namespace }}}
          podSelector:
            matchLabels: {app.kubernetes.io/component: rabbitmq}
      ports: [{port: {{ .Values.rabbitmq.port }}, protocol: TCP}]
    {{- end }}
{{- end }}
