{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "clinicflow-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "clinicflow-service.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: {{ .Values.networkPolicy.frontendComponent }}
      ports:
        - port: {{ .Values.port }}
          protocol: TCP
        - port: {{ .Values.managementPort }}
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: {{ .Values.managementPort }}
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
    {{- if .Values.rabbitmq.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: rabbitmq
      ports:
        - port: {{ .Values.rabbitmq.port }}
          protocol: TCP
    {{- end }}
{{- end }}
