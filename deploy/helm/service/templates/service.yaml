apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "clinicflow-service.labels" . | nindent 4 }}
    clinicflow.io/metrics: spring
spec:
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
    - name: management
      port: {{ .Values.managementPort }}
      targetPort: management
  selector:
    {{- include "clinicflow-service.selectorLabels" . | nindent 4 }}
