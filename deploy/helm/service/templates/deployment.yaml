apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "clinicflow-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "clinicflow-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "clinicflow-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.name }}
      {{- with .Values.credentials.checksum }}
      annotations:
        # Rolls the pods when the externally created credentials Secret changes (ADR-026).
        clinicflow.io/credentials-checksum: {{ . | quote }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: {{ include "clinicflow-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            - name: management
              containerPort: {{ .Values.managementPort }}
          envFrom:
            - configMapRef:
                name: {{ include "clinicflow-service.configName" . }}
            # This service's own database (runtime and Flyway owner) and broker logins, provisioned
            # by the platform bootstrap; no service receives another's or an administrator's (ADR-026).
            - secretRef:
                name: {{ include "clinicflow-service.credentialsSecretName" . }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            {{- if .Values.rabbitmq.enabled }}
            - name: SPRING_RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}
            - name: SPRING_RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            {{- end }}
            {{- if .Values.jwt.enabled }}
            - name: CLINICFLOW_SECURITY_JWT_PUBLIC_KEY_PATH
              value: /run/secrets/clinicflow/jwt-public.pem
            {{- if .Values.jwt.privateKeyEnabled }}
            - name: CLINICFLOW_SECURITY_JWT_PRIVATE_KEY_PATH
              value: /run/secrets/clinicflow/jwt-private.pem
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.jwt.enabled }}
            - name: jwt
              mountPath: /run/secrets/clinicflow
              readOnly: true
            {{- end }}
            # The root filesystem is read-only; Tomcat and the JVM write only to /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.jwt.enabled }}
        - name: jwt
          secret:
            secretName: {{ .Values.jwt.secretName }}
            items:
              - key: {{ .Values.jwt.publicKeyKey }}
                path: jwt-public.pem
              {{- if .Values.jwt.privateKeyEnabled }}
              - key: {{ .Values.jwt.privateKeyKey }}
                path: jwt-private.pem
              {{- end }}
        {{- end }}
