jenkins:
  systemMessage: "ClinicFlow local CI - configured exclusively through JCasC"
  numExecutors: 0
  mode: EXCLUSIVE
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: Local Jenkins administrator
          password: "${admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  nodes:
    - permanent:
        name: clinicflow-local-agent
        labelString: clinicflow-ci
        mode: EXCLUSIVE
        numExecutors: 1
        remoteFS: /home/jenkins/agent
        retentionStrategy: always
        launcher:
          ssh:
            host: agent
            port: 22
            credentialsId: clinicflow-agent-ssh
            javaPath: /opt/java/openjdk/bin/java
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 5
            sshHostKeyVerificationStrategy:
              manuallyProvidedKeyVerificationStrategy:
                key: "${agent-host-public-key}"

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: clinicflow-agent-ssh
              username: jenkins
              description: Local controller-to-agent key
              privateKeySource:
                directEntry:
                  privateKey: "${controller_agent_ed25519}"

unclassified:
  location:
    url: http://127.0.0.1:8080/
  timestamper:
    allPipelines: true

jobs:
  - script: >
      pipelineJob('clinicflow-engineering-stabilization') {
        description('Legacy local engineering stabilization pipeline. Kept runnable until every DM-02 replacement job passes.')
        definition {
          cpsScm {
            scm {
              git {
                remote { url(System.getenv('CLINICFLOW_JENKINS_SCM_URL')) }
                branch(System.getenv('CLINICFLOW_JENKINS_BRANCH'))
                extensions { cloneOptions { timeout(10) } }
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(false)
          }
        }
      }
  - script: |
      def repositoryUrl = System.getenv('CLINICFLOW_JENKINS_SCM_URL')
      def repositoryBranch = System.getenv('CLINICFLOW_JENKINS_BRANCH')
      def hygieneRegions = '''
      ^scripts/ci/Test-RepositoryHygiene\.ps1$
      ^\.gitleaks\.toml$
      ^\.gitignore$
      '''.stripIndent().trim()
      def backendSharedRegions = '''
      ^pom\.xml$
      ^mvnw$
      ^mvnw\.cmd$
      ^\.mvn/.*
      ^scripts/ci/(Invoke-ServiceBackend|Assert-ServicePackage|Build-ComponentImage|Remove-ComponentImage)\.ps1$
      ^deploy/jenkins/agent/.*
      '''.stripIndent().trim()
      def frontendSharedRegions = '''
      ^scripts/ci/(Invoke-FrontendPhase|Build-ComponentImage|Remove-ComponentImage)\.ps1$
      ^deploy/jenkins/agent/.*
      '''.stripIndent().trim()

      def components = [
        [
          name: 'clinicflow-auth-ci',
          description: 'Independent auth-service CI. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.auth',
          includedRegions: """^auth-service/.*
      ^Jenkinsfile\.auth$
      ^${backendSharedRegions}
      ^${hygieneRegions}"""
        ],
        [
          name: 'clinicflow-patient-ci',
          description: 'Independent patient-service CI. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.patient',
          includedRegions: """^patient-service/.*
      ^event-contracts/.*
      ^Jenkinsfile\.patient$
      ^${backendSharedRegions}
      ^${hygieneRegions}"""
        ],
        [
          name: 'clinicflow-appointment-ci',
          description: 'Independent appointment-service CI. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.appointment',
          includedRegions: """^appointment-service/.*
      ^event-contracts/.*
      ^Jenkinsfile\.appointment$
      ^${backendSharedRegions}
      ^${hygieneRegions}"""
        ],
        [
          name: 'clinicflow-clinical-ci',
          description: 'Independent clinical-service CI. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.clinical',
          includedRegions: """^clinical-service/.*
      ^event-contracts/.*
      ^Jenkinsfile\.clinical$
      ^${backendSharedRegions}
      ^${hygieneRegions}"""
        ],
        [
          name: 'clinicflow-notification-ci',
          description: 'Independent notification-service CI. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.notification',
          includedRegions: """^notification-service/.*
      ^event-contracts/.*
      ^Jenkinsfile\.notification$
      ^${backendSharedRegions}
      ^${hygieneRegions}"""
        ],
        [
          name: 'clinicflow-frontend-ci',
          description: 'Independent frontend CI. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.frontend',
          includedRegions: """^frontend/.*
      ^Jenkinsfile\.frontend$
      ^${frontendSharedRegions}
      ^${hygieneRegions}"""
        ],
        [
          name: 'clinicflow-system-ci',
          description: 'Full-stack system validation for shared and composition changes. See GitHub issue #6.',
          scriptPath: 'Jenkinsfile.system',
          includedRegions: '''
      ^Jenkinsfile\.system$
      ^event-contracts/.*
      ^pom\.xml$
      ^mvnw$
      ^mvnw\.cmd$
      ^\.mvn/.*
      ^frontend/src/app/api/.*
      ^frontend/src/lib/server/.*
      ^frontend/tests/e2e/.*
      ^frontend/(Dockerfile|package\.json|package-lock\.json|next\.config\.ts|playwright\.config\.ts)$
      ^(auth-service|patient-service|appointment-service|clinical-service|notification-service)/Dockerfile$
      ^docker-compose(\.ci)?\.yml$
      ^docker/.*
      ^deploy/helm/.*
      ^deploy/jenkins/.*
      ^scripts/ci/.*
      ^\.gitleaks\.toml$
      ^\.gitignore$
      '''.stripIndent().trim()
        ]
      ]

      components.each { component ->
        pipelineJob(component.name) {
          description(component.description)
          logRotator {
            numToKeep(20)
            artifactNumToKeep(10)
          }
          triggers {
            scm('H/5 * * * *')
          }
          definition {
            cpsScm {
              scm {
                git {
                  remote { url(repositoryUrl) }
                  branch(repositoryBranch)
                  extensions {
                    pathRestriction {
                      includedRegions(component.includedRegions)
                    }
                    cloneOptions { timeout(10) }
                  }
                }
              }
              scriptPath(component.scriptPath)
              lightweight(false)
            }
          }
        }
      }
