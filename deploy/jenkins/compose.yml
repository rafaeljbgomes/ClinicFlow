name: clinicflow-jenkins

services:
  controller:
    build:
      context: ./controller
    image: clinicflow/jenkins-controller:2.568.2
    restart: unless-stopped
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml
      CASC_STRICT_SECRET_RESOLUTION: "true"
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      CLINICFLOW_JENKINS_SCM_URL: ${CLINICFLOW_JENKINS_SCM_URL:-file:///workspace/clinicflow}
      CLINICFLOW_JENKINS_BRANCH: ${CLINICFLOW_JENKINS_BRANCH:-*/fix/engineering-stabilization}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins-home:/var/jenkins_home
      - ./casc:/var/jenkins_casc:ro
      - ./secrets/admin-password:/run/secrets/admin-password:ro
      - ./secrets/controller_agent_ed25519:/run/secrets/controller_agent_ed25519:ro
      - ./secrets/agent-host-public-key:/run/secrets/agent-host-public-key:ro
      - ../..:/workspace/clinicflow:ro
    networks:
      - jenkins-internal
    depends_on:
      agent:
        condition: service_started

  agent:
    build:
      context: ./agent
    image: clinicflow/jenkins-agent:8.9.0
    restart: unless-stopped
    environment:
      JENKINS_AGENT_SSH_PUBKEY_FILE: /run/secrets/controller_agent_ed25519.pub
      JENKINS_AGENT_SSH_HOST_KEY_FILE: /run/secrets/agent_host_ed25519
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - ./secrets/controller_agent_ed25519.pub:/run/secrets/controller_agent_ed25519.pub:ro
      - ./secrets/agent_host_ed25519:/run/secrets/agent_host_ed25519:ro
      - ./secrets/agent_host_ed25519.pub:/run/secrets/agent_host_ed25519.pub:ro
      - ../..:/workspace/clinicflow:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins-agent-workspace:/home/jenkins/agent
      - maven-cache:/home/jenkins/.m2
      - npm-cache:/home/jenkins/.npm
    networks:
      - jenkins-internal

networks:
  jenkins-internal:
    driver: bridge

volumes:
  jenkins-home:
  jenkins-agent-workspace:
  maven-cache:
  npm-cache:
